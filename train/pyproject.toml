[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trains-train"
version = "0.1.0"
readme = "README.md"
description = "Local model training primitives for Trains."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "samwenke" }]
dependencies = [
  "httpx>=0.27",
  "anyio>=4",
  "pillow>=13,<14", "pydantic-settings>=2.10", "numpy>=2", "zstandard>=0.23", "fastapi>=0.111", "pydantic>=2.12", "typer>=0.12", "uvicorn[standard]>=0.30",
  "torch>=2.6", "torchvision>=0.26", "transformers>=5.20.2,<5.21", "peft>=0.15", "tinker>=0.35,<0.36",
]

[project.optional-dependencies]
accelerated = ["kernels==0.17.2", "einops>=0.8.1,<0.9", "flash-attn-4[cu13]==4.0.0b37"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


[project.scripts]
train = "train.cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["train"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = [
  "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
  "ERA",
  "D",
  "PLC0415",
  "PLR0915",
  "PLW0602",
  "PLW0603",
  "S110",
  "S112",
  "TRY400",
  "TID",
]
ignore = ["E402", "E501", "B008", "D100", "D104", "D105"]
external = ["PG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["train"]
split-on-trailing-comma = false

[tool.pygate]
extend-exclude = ["tests"]

[tool.pygate.per-file-ignores]
"**/__init__.py" = ["PG4"]

[tool.ty.src]
include = ["train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "D"]
