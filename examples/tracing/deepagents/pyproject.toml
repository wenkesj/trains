[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trains-example-tracing-deepagents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "trains-sdk[tinker,cookbook,langsmith]",
  "trains-example-recipes[tracing]",
  "typer>=0.16",
  "transformers>=5.20.2,<5.21",
  "torch==2.14.1",
  "numpy==2.4.6",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "openai==2.54.0",
  "openinference-instrumentation-openai",
  "deepagents==0.7.32",
  "langchain-openai==1.7.3",
  "openinference-instrumentation-langchain==0.1.80"
]

[tool.hatch.build.targets.wheel]
packages = ["deepagents_tracing"]

[tool.uv.sources]
trains-sdk = {path = "../../../trains", editable = true}
trains-example-recipes = {path = "../../recipes", editable = true}
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.16", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D100", "D104", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.pygate]
extend-exclude = ["tests"]
