[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trains-example-tracing-claude-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "trains-sdk[tinker,cookbook,langfuse,langsmith]",
  "trains-example-recipes[tracing]",
  "typer>=0.16",
  "transformers>=5.20.2,<5.21",
  "torch==2.14.1",
  "numpy==2.4.6",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "claude-agent-sdk==0.2.174",
  "anthropic==2.3.0",
  "openinference-instrumentation-claude-agent-sdk==0.1.22",
  "openinference-instrumentation-anthropic>=3.1.0",
  "fastapi>=0.162,<0.163",
  "uvicorn>=0.54,<0.55"
]

[tool.hatch.build.targets.wheel]
packages = ["claude_tracing"]

[tool.uv.sources]
trains-sdk = {path = "../../../trains", editable = true}
trains-example-recipes = {path = "../../recipes", editable = true}
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.16", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D100", "D104", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.pygate]
extend-exclude = ["tests"]
