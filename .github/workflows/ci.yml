name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      TINKER_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --locked --all-packages --all-extras
      - name: Lint and type check
        run: uv run --locked task lint
      - name: CPU tests
        run: uv run --locked task test:python
      - name: Library doctests
        run: uv run --locked task doctest:python
      - name: Check OpenAPI snapshot
        run: uv run --locked task docs:openapi:check
      - name: Build distributions
        run: uv run --locked task packages:build
      - name: Check distribution metadata
        run: uv run --locked task packages:check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/
          retention-days: 3
          if-no-files-found: error
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: uv tool install go-task-bin==3.54.0
      - run: task docs:install
      - run: task docs:test
      - name: Build for GitHub Pages
        run: task docs:pages
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: documentation-preview
          path: docs/dist/
          retention-days: 3
          if-no-files-found: error
