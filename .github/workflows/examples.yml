name: Independent examples
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['examples/**', 'trains/**', 'pygate/**', 'pyproject.toml', 'uv.lock', 'Taskfile.yml', '.github/**']
  pull_request:
    paths: ['examples/**', 'trains/**', 'pygate/**', 'pyproject.toml', 'uv.lock', 'Taskfile.yml', '.github/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  example-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: discover
        run: python .github/scripts/examples.py matrix --github-output "$GITHUB_OUTPUT"
  examples:
    name: Example / ${{ matrix.example }}
    needs: example-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.example-matrix.outputs.matrix) }}
    env:
      EXAMPLE: ${{ matrix.example }}
      CUDA_VISIBLE_DEVICES: ''
      TINKER_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          python-version: '3.12'
      - name: Install quality tools
        run: uv sync --locked --only-group quality
      - name: Install example dependencies
        run: uv sync --project "$EXAMPLE" --locked --all-extras
      - name: Ruff and Pygate
        run: .venv/bin/task example:lint EXAMPLE="$EXAMPLE"
      - name: Type check example
        run: .venv/bin/task example:type EXAMPLE="$EXAMPLE"
      - name: CPU unit tests
        run: .venv/bin/task example:test EXAMPLE="$EXAMPLE"
  doctests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      TINKER_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --locked --all-packages --all-extras
      - name: Example doctests
        run: uv run --locked task doctest:examples
