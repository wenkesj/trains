name: Dependency security
on:
  push:
    branches: [main]
    paths: ['**/uv.lock', 'docs/package-lock.json', '.github/workflows/security.yml', 'Taskfile.yml']
  pull_request:
    paths: ['**/uv.lock', 'docs/package-lock.json', '.github/workflows/security.yml', 'Taskfile.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv tool install go-task-bin==3.54.0
      - name: Audit pinned Python packages
        run: task security:python
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv tool install go-task-bin==3.54.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: task security:npm
