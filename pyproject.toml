[tool.uv.workspace]
members = ["pygate", "trains", "train"]

exclude = ["examples/*"]

[tool.uv]
# Shared dev environment exercises Inspect/Fireworks and Loops/management together.
# Compatibility pins are documented in examples/inspect and examples/harbor.
override-dependencies = ["pydantic==2.12.5", "baseten==0.12.0"]
environments = ["sys_platform == 'linux' and python_version == '3.12'"]

[tool.uv.sources]
trains-example-recipes = {path = "examples/recipes", editable = true}
baseten = {git = "https://github.com/basetenlabs/baseten-python", rev = "cc581e198d2c4a4f039cc555ec1afd10b73737f2"}
pygate = { workspace = true }

[dependency-groups]
quality = ["ruff>=0.17.1", "ty>=0.0.89", "go-task-bin>=3.53", "pygate"]
dev = [
  "trains-example-recipes",
  "baseten==0.12.0",
  "arize-phoenix-otel>=0.15,<1",
  "pygate",
  "ipython>=9.17",
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "ruff>=0.16",
  "ty>=0.0.1a14",
  "py-spy>=0.3.14",
  "mcp-types>=2.3",
  "go-task-bin>=3.53"
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocstrings[python]>=1.0.8",
    "pygments>=2.21.0",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
