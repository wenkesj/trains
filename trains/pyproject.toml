[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trains-sdk"
version = "0.1.0"
readme = "README.md"
description = "Turn your evals into trains."
requires-python = ">=3.12"
dependencies = ["datasets>=5.1,<6", "pydantic>=2.7"]

[project.optional-dependencies]
harvey = ["lab-core @ https://github.com/harveyai/harvey-labs/releases/download/v1.3.0/lab_core-1.3.0-py3-none-any.whl"]
inspect = ["inspect-ai>=0.3.200,<0.4"]
cookbook = ["tinker-cookbook==0.5.9"]
video = ["av>=14,<17", "pillow>=13,<14"]
tinker = ["tinker==0.35.0"]
baseten = ["baseten-loops==0.32.0"]
fireworks = ["fireworks-ai[training-sdk]==1.2.27"]
arize-ax = ["arize>=8.61,<9"]
arize-phoenix = ["arize-phoenix-client>=3.5,<4"]
openinference = ["openinference-semantic-conventions>=0.1"]
langsmith = ["langsmith>=0.4,<1"]
langfuse = ["langfuse>=4.18,<5"]
atif = ["atif>=1.8,<2"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["trains"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = [
  "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
  "ERA",
  "D",
  "PLC0415",
  "PLR0915",
  "PLW0602",
  "PLW0603",
  "S110",
  "S112",
  "TRY400",
  "TID",
]
ignore = ["E402", "E501", "B008", "D100", "D104", "D105"]
external = ["PG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["trains"]
split-on-trailing-comma = false

[tool.pygate]
extend-exclude = ["tests"]

[tool.pygate.per-file-ignores]
"**/__init__.py" = ["PG4"]

[tool.ty.src]
include = ["trains"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "D"]
